<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;font-family:'DejaVu Sans',Roboto,Arial,sans-serif}
.card{width:1080px;padding:40px 0 30px;background:#000;color:#fff}
svg text{font-family:'DejaVu Sans',Roboto,Arial,sans-serif}
</style></head><body><div class="card" id="c"></div>
<script>
const q=new URLSearchParams(location.search);
const mode=q.get('mode')||'pair';
const B='#7cc8ff',Y='#ffe14d',G='#6ee7a0';
const pair=mode==='pair';
const ip='10.0.0.192', port=pair?'44747':'36801';
const rows=pair?[
 [B,'1','IP address',ip,'Type in the “IP address” box'],
 [Y,'2','Pairing port',port,'Type in the “Pairing port” box'],
 [G,'3','6-digit code','465438','Type in the “6-digit code” box']]
:[
 [B,'1','IP address',ip,'Type in the “IP address” box'],
 [Y,'2','Port',port,'Type in the “Port” box']];
const H= 900 + rows.length*190 + 130;
let s=`<svg width="1080" height="${H}" viewBox="0 0 1080 ${H}" xmlns="http://www.w3.org/2000/svg">`;
s+=`<text x="540" y="40" fill="#fff" font-size="44" font-weight="bold" text-anchor="middle">${pair?'Your watch: “Pair new device”':'Your watch: “Wireless debugging”'}</text>`;
// watch
const cx=540,cy=490,R=320;
s+=`<rect x="${cx-90}" y="${cy-R-60}" width="180" height="80" rx="20" fill="#333"/>`;
s+=`<rect x="${cx-90}" y="${cy+R-20}" width="180" height="80" rx="20" fill="#333"/>`;
s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#3a3a3a"/><circle cx="${cx}" cy="${cy}" r="${R-22}" fill="#0b0b0b"/>`;
s+=`<rect x="${cx+R-8}" y="${cy-90}" width="22" height="60" rx="8" fill="#444"/><rect x="${cx+R-8}" y="${cy+20}" width="22" height="60" rx="8" fill="#444"/>`;
function badge(x,y,c,n,r=30){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><text x="${x}" y="${y+r*0.36}" font-size="${r*1.1}" font-weight="bold" fill="#000" text-anchor="middle">${n}</text>`}
const addrY = pair? cy+120 : cy+40;
if(pair){
 s+=`<text x="${cx}" y="${cy-150}" fill="#aaa" font-size="34" text-anchor="middle">Wi-Fi pairing code</text>`;
 s+=`<rect x="${cx-160}" y="${cy-128}" width="320" height="96" rx="18" fill="none" stroke="${G}" stroke-width="7"/>`;
 s+=`<text x="${cx}" y="${cy-58}" fill="#fff" font-size="66" font-weight="bold" text-anchor="middle" letter-spacing="4">465438</text>`;
 s+=badge(cx+205,cy-80,G,'3');
 s+=`<text x="${cx}" y="${cy+40}" fill="#aaa" font-size="34" text-anchor="middle">IP address and port</text>`;
}else{
 s+=`<text x="${cx}" y="${cy-120}" fill="#aaa" font-size="34" text-anchor="middle">Device name</text>`;
 s+=`<text x="${cx}" y="${cy-75}" fill="#ddd" font-size="38" text-anchor="middle">SM-R870</text>`;
 s+=`<text x="${cx}" y="${cy-20}" fill="#aaa" font-size="34" text-anchor="middle">IP address and port</text>`;
}
// address text with measured parts (monospace-ish widths via font-size)
const fs=56;
s+=`<text id="addr" x="${cx}" y="${addrY}" font-size="${fs}" font-weight="bold" text-anchor="middle"><tspan id="ip" fill="${B}">${ip}</tspan><tspan fill="#fff">:</tspan><tspan id="pt" fill="${Y}">${port}</tspan></text>`;
s+=`<g id="marks"></g>`;
if(!pair){s+=`<text x="${cx}" y="${cy+175}" fill="#bbb" font-size="32" text-anchor="middle">(not the pairing port)</text>`;}
// rows
let y=900;
rows.forEach(([c,n,label,val,hint])=>{
 s+=`<rect x="60" y="${y}" width="960" height="160" rx="26" fill="#1c1c1c" stroke="${c}" stroke-width="5"/>`;
 s+=badge(130,y+80,c,n,40);
 s+=`<text x="200" y="${y+68}" fill="${c}" font-size="46" font-weight="bold">${label}: <tspan fill="#fff">${val}</tspan></text>`;
 s+=`<text x="200" y="${y+126}" fill="#ddd" font-size="36">${hint}</text>`;
 y+=190;
});
s+=`<text x="540" y="${y+40}" fill="#ddd" font-size="38" text-anchor="middle">Your numbers will be different.</text><text x="540" y="${y+92}" fill="#ddd" font-size="38" text-anchor="middle">Copy them from your watch.</text>`;
s+=`</svg>`;
document.getElementById('c').innerHTML=s;
// underline + badges under ip/port using real measurements
const ipE=document.getElementById('ip'),ptE=document.getElementById('pt');
const a=ipE.getBBox? null:null;
function box(el){const t=el.getExtentOfChar?el:null;const n=el.getNumberOfChars();const s0=el.getStartPositionOfChar(0).x;const e0=el.getEndPositionOfChar(n-1).x;return [s0,e0]}
const [i0,i1]=box(ipE),[p0,p1]=box(ptE);
let m='';const uy=addrY+16;
m+=`<rect x="${i0}" y="${uy}" width="${i1-i0}" height="9" rx="4" fill="${B}"/>`;
m+=`<rect x="${p0}" y="${uy}" width="${p1-p0}" height="9" rx="4" fill="${Y}"/>`;
m+=badge((i0+i1)/2,uy+48,B,'1');
m+=badge((p0+p1)/2,uy+48,Y,'2');
document.getElementById('marks').innerHTML=m;
</script></body></html>
